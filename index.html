<!DOCTYPE html>
<html lang="en">

        <div class="top">
            <h1>Guess the Word</h1>

            <!-- Win count panel -->
            <div class="win-show">
                <h2 id="win-count"> </h2>
            </div>
        </div>

        <!-- The div that is used to display the boxes -->
        <div id="board"></div>
        <div class="form-text">
            <input id="guessInput" type="text">
            <button id="guessBtn">Guess</button>
